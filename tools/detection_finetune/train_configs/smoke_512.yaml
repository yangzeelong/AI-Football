# 512 冒烟：只用来确认"训练能跑通 + 输出列数 = 4 + 类别下标正确"。
# 分辨率只写 resolution —— **不要**写 positional_encoding_size（base 权重是 32²，
# 写成 960 对应的 60² 会在加载时 size mismatch 报错）。
model:
  resolution: 512
  gradient_checkpointing: false
  device: cuda

train:
  epochs: 2
  batch_size: 2
  grad_accum_steps: 1
  num_workers: 0
  lr: 0.0001
  lr_encoder: 0.00015
  lr_vit_layer_decay: 0.8
  lr_component_decay: 0.7
  use_ema: false
  multi_scale: false
  expanded_scales: false
  tensorboard: false
  early_stopping: false
  checkpoint_interval: 1
  output_dir: runs/smoke_512
