labels:
  person:
    - person
  ball:
    - sports ball
    - ball
    - football
    - soccer ball

filters:
  person:
    min_confidence: 0.68
    min_width_px: 8
    min_height_px: 24
  ball:
    min_confidence: 0.4
    min_width_px: 2
    min_height_px: 2

box_smoothing:
  enabled: false
  static_alpha: 0.15
  moving_alpha: 0.45
  static_distance_px: 8
  ttl_frames: 60

pose_box_expansion:
  enabled: true
  x_pad_ratio: 0.15
  y_pad_ratio: 0.25
  min_pad_px: 12

keypoint_smoothing:
  enabled: true
  method: skeleton
  static_window: 8
  static_motion_px: 2.5
  deadband_px: 0.8
  low_confidence: 0.3
  low_confidence_alpha: 0.12
  min_cutoff: 0.5
  beta: 0.02
  d_cutoff: 1.0
  static_alpha: 0.25
  moving_alpha: 0.65
  jitter_alpha: 0.08
  max_static_jump_px: 10
  skeleton_anchor_alpha: 0.35
  skeleton_endpoint_alpha: 0.12
  skeleton_moving_endpoint_alpha: 0.45
  skeleton_fast_endpoint_alpha: 0.22
  skeleton_fast_moving_endpoint_alpha: 0.62
  skeleton_fast_static_step_px: 5
  skeleton_max_static_step_px: 2.5
  skeleton_limb_tolerance: 0.25
  sensitive_keypoints:
    - left_wrist
    - right_wrist
    - left_ankle
    - right_ankle
    - left_big_toe
    - left_small_toe
    - left_heel
    - right_big_toe
    - right_small_toe
    - right_heel

models:
  detector:
    confidence: 0.25
    class_names:
      - person
      - sports ball
    rfdetr_size: small
    rfdetr_model_dir: models/rfdetr
    input_resolution: null
  pose:
    preset: rtmpose-m
    config_path: models/mmpose/configs/wholebody_2d_keypoint/rtmpose/coco-wholebody/rtmpose-m_8xb64-270e_coco-wholebody-256x192.py
    checkpoint_path: models/mmpose/rtmpose-wholebody/rtmpose-m_simcc-coco-wholebody_pt-aic-coco_270e-256x192-cd5e845c_20230123.pth
  runtime:
    tracker: botsort.yaml
