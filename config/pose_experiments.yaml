output_root: tmp/pose_experiments
# video: data/素材/传球-720p60.mov
video: data/素材/射门1-1080p60.mov
roi_config: config/roi.json
base_app_config: config/app.yaml
video_labels: config/video_labels.yaml

defaults:
  detector: rfdetr
  rfdetr_size: small
  model_dir: models/rfdetr
  yolo_model: models/yolo/yolov8n.pt
  imgsz: 640
  conf: 0.25
  device: cuda:0
  pose_device: cuda:0
  use_roi: true
  output_video: true
  evaluate: true

experiments:
  - name: hrnet_w48_skeleton_stride1
    pose_model: hrnet-w48-dark
    stride: 1
    max_frames: 6000
    app_overrides:
      keypoint_smoothing:
        enabled: true
        method: skeleton

  - name: hrnet_w48_no_smooth_stride1
    pose_model: hrnet-w48-dark
    stride: 1
    max_frames: 6000
    app_overrides:
      keypoint_smoothing:
        enabled: false

  - name: rtmpose_m_skeleton_stride1
    pose_model: rtmpose-m
    stride: 1
    max_frames: 6000
    app_overrides:
      keypoint_smoothing:
        enabled: true
        method: skeleton

  - name: hrnet_w48_skeleton_stride3
    pose_model: hrnet-w48-dark
    stride: 3 
    max_frames: 6000
    app_overrides:
      keypoint_smoothing:
        enabled: false
