# ============================================================================
# coco_tf32_w48 —— COCO 80 类 + TF32 检测 + HRNet-W48(288x384)：**与 Python 严格对等的参考档**
#
# 实测吞吐（口径：射门1-1080p60、2000 帧、**无渲染**、ROI 按本文件、16 核空闲）：
#     26.2 FPS / 38.1 ms 每帧（人/帧 4.24）| 全片未测（该口径偏低 15–20%）
#     本档目的是数值对等（half: false），**不要拿它当速度基线**——fp16 快约 30%
#
# FPS 由什么决定（本目录 4 份配置同机同视频对比的结论）：
#   * **人的数量是主因，不是模型**：每多 1 人/帧约 +1.6 ms。实测同一条 W32 配置
#     ROI 关（人/帧 10.7）→ 46.5 FPS；ROI 开（人/帧 3.6）→ 108.0 FPS。
#   * 本目录 ROI 多边形是按 `射门1-1080p60` 标的；换机位必须重标，否则会静默裁掉画面里的人/球。
#   * **本目录 4 份都到不了 108 FPS**：>90 FPS 需要“三分类 + fp16 + W32(192x256) 无 flipTest
#     + 每帧约 3.5 人（ROI 或人少的机位）
#     ”同时成立，实测 108.0 FPS（见 tools/rollout/README.md 的吞吐节）。
#     本目录最贵的是 W48+flipTest（姿态引擎每批 10.24 ms vs W32 无 flip 的 2.79 ms）与 TF32 检测。
#   * **渲染不在上面的数字里**：app 内置 `--render` 实测 19.0 ms/帧（≈ -35% 吞吐）；
#     离线 `Nexusflow/tools/render_jsonl.py` 27.5 ms/帧，但可与下一段的 GPU 任务并行。
#     要报“端到端出视频”的吞吐，必须用开渲染的数字。
# 复测：
#   cd /home/hx1/yzl/Work/Nexusflow && ./build/bin/aifootball_app \
#     examples/aifootball_app/config/coco_tf32_w48.yaml \
#     --video_path /home/hx1/yzl/Work/data/射门1-1080p60.mov --output_dir /tmp/fps --max_frames 2000
# ============================================================================

graph:
  name: AIFootball-TensorRT

  modules:
    - name: VideoReader
      class: VideoReader
      config:
        videoPath: data/射门1-1080p60.mov
        stride: 1
        # Decoded RGB frames kept for reuse by the decoder. A slot is recycled
        # only after the pipeline drops its last reference, so this must cover
        # algorithm.maxPendingFrames plus the frames in flight inside the
        # pipeline. Measured with maxPendingFrames=32: 56 slots still allocate a
        # fresh 1080p buffer (~6 MB) for every frame, 64 and above reuse.
        rgbRingSize: 64

    - name: VideoDecoder
      class: VideoDecoder
      config:
        pixelFormat: rgb24

    - name: RFDetrDetector
      class: RFDetrDetector
      config:
        # TF32 detector: the accurate path, for validating output against the
        # Python reference.
        #
        # The fp16 engine (coco_fp16_w48.yaml) loses whole detections: on
        # data/射门1-1080p60.mov its raw person count disagreed with the
        # reference on 22/300 frames, with a person at confidence 0.86 vanishing
        # outright, so neither the confidence threshold nor the top-300
        # candidate cut could recover it. This engine matched the reference on
        # 300/300 frames, and over 1500 frames differed from the fp32 engine in
        # 2 person and 7 ball counts, i.e. tie-breaking noise.
        #
        # Costs throughput: 57.41 ms vs 12.95 ms per batch of 4, about 43 FPS
        # instead of 83 FPS end to end. See tools/model_conversion/README.md for
        # building the engine.
        enginePath: /home/hx1/yzl/Work/AI-Football/models/rfdetr/rf-detr-small-960-fp32tf32-b8.engine
        inputBindingName: image
        outputBindingName: detections    # baked [B,N,6]; auto-detected if absent
        logitsBindingName: pred_logits   # raw format fallback
        boxesBindingName: pred_boxes     # raw format fallback
        inputSize: 960                   # Matches the resolution comparison experiment
        numClasses: 80
        numQueries: 300
        confidenceThreshold: 0.25
        targetClasses: [1, 37]           # RF-DETR COCO ids: 1 = person, 37 = sports ball
        # ImageNet normalization (applied after /255)
        meanR: 0.485
        meanG: 0.456
        meanB: 0.406
        stdR: 0.229
        stdG: 0.224
        stdB: 0.225
        useGpuPreprocess: true       # CUDA resize + normalize + HWC->CHW
        # Batching. Requires a TensorRT engine built from a dynamic-batch ONNX
        # model for values > 1. Static batch=1 engines are automatically clamped.
        maxBatchSize: 4
        instanceCount: 1                 # Each instance owns a TRT context/stream and GPU buffers
        batchTimeoutMs: 0                # 0 = no timeout, drain only when full or EOF
        maxRetryNum: 0                   # 0 = disabled; >0 = force drain after N frames (anti-starvation)

    - name: ByteTracker
      class: ByteTracker
      config:
        trackActivationThreshold: 0.25
        secondAssociationThreshold: 0.10
        minimumMatchingThreshold: 0.80
        # Only a confident detection may start a track. Left at 0, a weak
        # (0.25..0.68) detection opens a track that then outbids the real one on
        # IoU, which shows up as the track ID changing while the box barely
        # moves. BoT-SORT calls the same knob new_track_thresh.
        newTrackThreshold: 0.68
        lostTrackBuffer: 30
        personClassId: 1
        ballClassId: 37
        # Same post-ROI box filters as AI-Football/config/app.yaml.
        personMinConfidence: 0.68
        personMinWidthPx: 8.0
        personMinHeightPx: 24.0
        ballMinConfidence: 0.4
        ballMinWidthPx: 2.0
        ballMinHeightPx: 2.0

    - name: HRNetPoseEstimator
      class: HRNetPoseEstimator
      config:
        enginePath: /home/hx1/yzl/Work/AI-Football/models/mmpose/hrnet/hrnet-w48-dark-ch23-fp16-b8-fp32io.engine
        inputBindingName: images
        outputBindingName: heatmaps
        inputWidth: 288                  # W
        inputHeight: 384                 # H
        heatmapWidth: 72                 # W/4
        heatmapHeight: 96                # H/4
        numKeypoints: 23                 # COCO-WholeBody body channels kept by the export
        stride: 4
        useDark: true                    # DARK sub-pixel refinement
        flipTest: true                   # Match MMPose heatmap flip-test TTA
        darkBlurKernel: 11               # MMPose MSRAHeatmap DARK kernel
        bboxPadding: 1.25                # MMPose GetBBoxCenterScale padding
        poseBoxExpansion: true
        xPadRatio: 0.15
        yPadRatio: 0.25
        minPadPx: 12.0
        maxBatch: 8                     # Engine profile max is 8; do not exceed it
        batchFrameCount: 4             # Aggregate detector frames before pose inference
        instanceCount: 2                 # Each instance owns a TRT context/stream and GPU buffers
        keypointConfThr: 0.05
        # ImageNet normalization (0..255 scale)
        meanR: 123.675
        meanG: 116.28
        meanB: 103.53
        stdR: 58.395
        stdG: 57.12
        stdB: 57.375

    - name: KeypointSmoother
      class: KeypointSmoother
      config:
        enabled: true
        method: skeleton
        staticWindow: 8
        staticMotionPx: 2.5
        deadbandPx: 0.8
        lowConfidence: 0.3
        lowConfidenceAlpha: 0.12
        staticAlpha: 0.25
        movingAlpha: 0.65
        skeletonAnchorAlpha: 0.35
        skeletonEndpointAlpha: 0.12
        skeletonMovingEndpointAlpha: 0.45
        skeletonFastEndpointAlpha: 0.22
        skeletonFastMovingEndpointAlpha: 0.62
        skeletonFastStaticStepPx: 5.0
        skeletonMaxStaticStepPx: 2.5
        skeletonLimbTolerance: 0.25

    - name: FootballTracker
      class: FootballTracker
      config:
        maxMissedFrames: 12
        maxAssociationDistancePx: 180.0
        confidenceDecay: 0.75
        ballClassId: 37
        # true keeps this variant comparable with the Python reference, which
        # follows a single ball. Set false to also report the other candidates
        # as untracked observations (track id -1).
        keepOnlyBestBall: true

    - name: VideoRenderer
      class: VideoRenderer
      config:
        enabled: false                 # Rendering is handled by tools/render_jsonl.py
        outputPath: output/rendered.mp4
        fps: 60.0
        stride: 1

    - name: ObservationWriter
      class: ObservationWriter
      config:
        outputPath: output/observations.jsonl
        cameraId: C1
        videoPath: data/射门1-1080p60.mov
        fps: 60.0
        stride: 1

    - name: AlarmPusher
      class: AlarmPusher
      config:
        savePath: result.txt

  connections:
    - from: VideoReader
      to: VideoDecoder
    - from: VideoDecoder
      to: RFDetrDetector
    - from: RFDetrDetector
      to: ByteTracker
    - from: ByteTracker
      to: HRNetPoseEstimator
    - from: HRNetPoseEstimator
      to: KeypointSmoother
    - from: KeypointSmoother
      to: FootballTracker
    - from: FootballTracker
      to: VideoRenderer
    - from: VideoRenderer
      to: ObservationWriter
    - from: VideoRenderer
      to: AlarmPusher

# Algorithm configuration is parsed by the SDK app and passed through the
# public AIFootballContext API. Coordinates use the source video resolution.
algorithm:
  # Bound the asynchronous input queue. Every frame submitted but not yet
  # consumed pins one decoded frame (~6 MB at 1080p), so an unbounded queue lets
  # the decoder run far ahead of the slowest stage and exhaust memory.
  # 0 = unbounded. QueuePolicy::Block (the default) turns the bound into
  # backpressure by blocking ProcessAsync().
  maxPendingFrames: 32
  inputQueuePolicy: block
  roi:
    enabled: true
    width: 1920
    height: 1080
    points:
      - [1579, 1067]
      - [56, 733]
      - [950, 416]
      - [1796, 493]
